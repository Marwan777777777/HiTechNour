name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  concurrency-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hitech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hitech_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hitech_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hitech_test
      JWT_SECRET: test-only-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run concurrency regression suite
        run: npm run test:concurrency
