name: HiTechNour CI

on:
  push:
    branches: [main, "refine/**"]
  pull_request:

jobs:
  syntax-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find backend/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
